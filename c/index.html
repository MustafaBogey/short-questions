  const P = pages(), i = P.indexOf(st.page), n = el("div", "nav");
  if (i > 0) { const b = el("button", "btn", "Back"); b.onclick = () => go(P[i - 1]); n.appendChild(b); }
  const x = el("button", "btn primary", nextLabel || "Next"); x.onclick = () => go(P[i + 1]); n.appendChild(x);
  kids.push(n);
}
function lensPage(kids, lp) {
  const L = D.lens, f = L.fam[lp[0][0]];
  const S = id => L.setting[id], P = id => f.phrase[st.m[id]];
  kids.push(el("h2", null, "One optional extra"));
  kids.push(el("p", "text", "This part is optional. A psychologist, Carl Jung, had a way of looking at something you answered. Would you like to see it?"));
  const c = el("div", "q");
  choice(c, [["y", "Yes, show me"], ["n", "No, thanks"]], null, () => st.lens.opt, v => { st.lens.opt = v; });
  kids.push(c);
  if (st.lens.opt !== "y") return;
  kids.push(el("p", "text", f.lead.replace("{S1}", S(lp[0])).replace("{P1}", P(lp[0])).replace("{S2}", S(lp[1])).replace("{P2}", P(lp[1]))));
  for (const t of L.text) kids.push(el("p", "text", t));
  kids.push(askNode(L.ask));
  lp.forEach((id, i) => {
    const q = el("div", "q"), s = S(id);
    q.appendChild(askNode("{" + s[0].toUpperCase() + s.slice(1) + ":} " + P(id)));
    choice(q, L.opts, null, () => st.lens.r[i], setIn(st.lens.r, i)); kids.push(q);
  });
}
function update(scroll) {
  const lp = lensPair(), lk = lp ? lp.join("") : null;
  if (st.lens.pair !== lk) st.lens = { pair: lk, opt: null, r: {} };
  let P = pages(); if (P.indexOf(st.page) < 0) st.page = "end";
  save();
  const app = document.getElementById("app"), kids = [], p = st.page, i = P.indexOf(p), last = P.length - 2;
  const top = el("div", "top"); top.appendChild(el("span", null, p === "start" ? "Start" : p === "done" ? "Finished" : "Page " + i + " of " + last)); top.appendChild(el("span", null, "Nothing is sent from this page.")); kids.push(top);
  if (p === "start") {
    kids.push(el("h2", null, "A short set of questions about you"));
    const ul = el("ul", "plain");
    D.welcome.forEach(t => ul.appendChild(el("li", null, t)));
    kids.push(ul);
    const w = el("div", "q"); w.appendChild(el("p", "ask", "Which reader are you?"));
    choice(w, D.readers.map(k => [k, "Reader " + k]), null, () => st.who, v => { st.who = v; });
    kids.push(w);
    for (const q of D.start) kids.push(single(q));
    nav(kids, "Begin");
  } else if (p === "s0" || p === "s1") {
    kids.push(el("h2", null, "Part 1 of 2"));
    kids.push(el("p", "intro", "Finish each sentence with the answer that fits you best."));
    const k = p === "s0" ? 0 : 1, half = Math.ceil(D.items.length / 2);
    for (const q of D.items.slice(k * half, (k + 1) * half)) kids.push(item(q));
    nav(kids);
  } else if (p[0] === "g") {
    const g = D.groups[+p.slice(1)];
    if (p === "g0") {
      kids.push(el("h2", null, "Part 2 of 2: the same thing in different settings"));
      for (const t of D.part2) kids.push(el("p", "text", t));
      const b = el("div", "box"); for (const t of D.who) b.appendChild(askNode(t)); kids.push(b);
    }
    kids.push(el("h2", null, g.title));
    if (g.intro) kids.push(el("p", "intro", g.intro));
    for (const id of g.ids) kids.push(card(CARD[id]));
    nav(kids);
  } else if (p === "lens") {
    lensPage(kids, lp); nav(kids);
  } else if (p === "end") {
    kids.push(el("h2", null, "Last two"));
    for (const q of D.end) kids.push(single(q));
    nav(kids, "Finish");
  } else {
    kids.push(el("h2", null, "Done. Thank you."));
    const blank = D.items.filter(q => !st.s[q.id]).length + D.cards.filter(q => !st.m[q.id]).length;
    if (blank) kids.push(el("div", "warn", blank + " question" + (blank > 1 ? "s were" : " was") + " left blank. That is fine. You can also go back."));
    kids.push(el("p", "intro", "Copy this code and send it back to the person who gave you this link."));
    const ta = el("textarea"); ta.readOnly = true; ta.value = code(); ta.onfocus = () => ta.select(); kids.push(ta);
    const n = el("div", "nav");
    const back = el("button", "btn", "Back"); back.onclick = () => go("end"); n.appendChild(back);
    const cp = el("button", "btn primary", "Copy code");
    cp.onclick = async () => { let ok = false; try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { try { ta.focus(); ta.select(); ok = document.execCommand("copy"); } catch (e2) {} }
      cp.textContent = ok ? "Copied" : "Select the text above and copy it"; };
    n.appendChild(cp); kids.push(n);
    const again = el("button", "btn", "Clear everything and start for the next person"); again.style.width = "100%"; let armed = false;
    again.onclick = () => { if (!armed) { armed = true; again.textContent = "Tap again to clear these answers (copy the code first)"; return; }
      st = fresh(); update(true); };
    kids.push(again);
  }
  app.replaceChildren(...kids);
  if (scroll) { try { window.scrollTo(0, 0); app.scrollIntoView(); } catch (e) {} }
}
if (DEBUG) { st = fresh(); Object.assign(st, DEBUG); }
update();
</script>
