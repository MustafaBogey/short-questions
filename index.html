<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A short set of questions</title></head>
<body>
<style>
  :root { --font-sans: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --font-mono: ui-monospace, Menlo, Consolas, monospace;

<style>

  .q { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 14px 12px; margin: 0 0 10px; }
  .ask { font-size: 16px; font-weight: 600; margin: 0 0 10px; }

  textarea { width: 100%; min-height: 130px; font-family: var(--font-mono); font-size: 13px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--code-background, transparent); color: inherit; }

<script>
const D = {"items": [{"a": "V", "r": false, "t": "I get angry easily."}, {"a": "W", "r": true, "t": "I seldom feel blue."}, {"a": "C", "r": true, "t": "I am not interested in other people's problems."}, {"a": "P", "r": false, "t": "I respect authority."}, {"a": "I", "r": false, "t": "I carry out my plans."}, {"a": "O", "r": true, "t": "I leave my belongings around."}, {"a": "E", "r": false, "t": "I make friends easily."}, {"a": "A", "r": false, "t": "I take charge."}, {"a": "N", "r": false, "t": "I am quick to understand things."}, {"a": "Q", "r": false, "t": "I enjoy the beauty of nature."}, {"a": "V", "r": true, "t": "I rarely get irritated."}, {"a": "W", "r": false, "t": "I am filled with doubts about things."}, {"a": "C", "r": false, "t": "I feel others' emotions."}, {"a": "P", "r": true, "t": "I insult people."}, {"a": "I", "r": true, "t": "I waste my time."}, {"a": "O", "r": false, "t": "I like order."}, {"a": "E", "r": true, "t": "I am hard to get to know."}, {"a": "A", "r": false, "t": "I have a strong personality."}, {"a": "N", "r": true, "t": "I have difficulty understanding abstract ideas."}, {"a": "Q", "r": false, "t": "I believe in the importance of art."}, {"a": "V", "r": false, "t": "I get upset easily."}, {"a": "W", "r": true, "t": "I feel comfortable with myself."}, {"a": "C", "r": false, "t": "I inquire about others' well-being."}, {"a": "P", "r": false, "t": "I hate to seem pushy."}, {"a": "I", "r": true, "t": "I find it difficult to get down to work."}, {"a": "O", "r": false, "t": "I keep things tidy."}, {"a": "E", "r": true, "t": "I keep others at a distance."}, {"a": "A", "r": true, "t": "I lack the talent for influencing people."}, {"a": "N", "r": false, "t": "I can handle a lot of information."}, {"a": "Q", "r": false, "t": "I love to reflect on things."}, {"a": "V", "r": true, "t": "I keep my emotions under control."}, {"a": "W", "r": false, "t": "I feel threatened easily."}, {"a": "C", "r": true, "t": "I can't be bothered with other people's needs."}, {"a": "P", "r": true, "t": "I believe that I am better than others."}, {"a": "I", "r": true, "t": "I mess things up."}, {"a": "O", "r": false, "t": "I follow a schedule."}, {"a": "E", "r": true, "t": "I reveal little about myself."}, {"a": "A", "r": false, "t": "I know how to captivate people."}, {"a": "N", "r": false, "t": "I like to solve complex problems."}, {"a": "Q", "r": false, "t": "I get deeply immersed in music."}, {"a": "V", "r": false, "t": "I change my mood a lot."}, {"a": "W", "r": true, "t": "I rarely feel depressed."}, {"a": "C", "r": false, "t": "I sympathize with others' feelings."}, {"a": "P", "r": false, "t": "I avoid imposing my will on others."}, {"a": "I", "r": false, "t": "I finish what I start."}, {"a": "O", "r": true, "t": "I am not bothered by messy people."}, {"a": "E", "r": false, "t": "I warm up quickly to others."}, {"a": "A", "r": true, "t": "I wait for others to lead the way."}, {"a": "N", "r": true, "t": "I avoid philosophical discussions."}, {"a": "Q", "r": true, "t": "I do not like poetry."}, {"a": "V", "r": true, "t": "I rarely lose my composure."}, {"a": "W", "r": false, "t": "I worry about things."}, {"a": "C", "r": true, "t": "I am indifferent to the feelings of others."}, {"a": "P", "r": false, "t": "I rarely put people under pressure."}, {"a": "I", "r": true, "t": "I don't put my mind on the task at hand."}, {"a": "O", "r": false, "t": "I want everything to be \"just right.\""}, {"a": "E", "r": true, "t": "I rarely get caught up in the excitement."}, {"a": "A", "r": false, "t": "I see myself as a good leader."}, {"a": "N", "r": true, "t": "I avoid difficult reading material."}, {"a": "Q", "r": false, "t": "I see beauty in things that others might not notice."}, {"a": "V", "r": false, "t": "I am a person whose moods go up and down easily."}, {"a": "W", "r": false, "t": "I am easily discouraged."}, {"a": "C", "r": true, "t": "I take no time for others."}, {"a": "P", "r": true, "t": "I take advantage of others."}, {"a": "I", "r": false, "t": "I get things done quickly."}, {"a": "O", "r": true, "t": "I am not bothered by disorder."}, {"a": "E", "r": true, "t": "I am not a very enthusiastic person."}, {"a": "A", "r": false, "t": "I can talk others into doing things."}, {"a": "N", "r": false, "t": "I have a rich vocabulary."}, {"a": "Q", "r": false, "t": "I need a creative outlet."}, {"a": "V", "r": true, "t": "I am not easily annoyed."}, {"a": "W", "r": true, "t": "I am not embarrassed easily."}, {"a": "C", "r": false, "t": "I take an interest in other people's lives."}, {"a": "P", "r": true, "t": "I seek conflict."}, {"a": "I", "r": false, "t": "I always know what I am doing."}, {"a": "O", "r": true, "t": "I dislike routine."}, {"a": "E", "r": false, "t": "I show my feelings when I'm happy."}, {"a": "A", "r": true, "t": "I hold back my opinions."}, {"a": "N", "r": false, "t": "I think quickly."}, {"a": "Q", "r": true, "t": "I seldom get lost in thought."}, {"a": "V", "r": false, "t": "I get easily agitated."}, {"a": "W", "r": false, "t": "I become overwhelmed by events."}, {"a": "C", "r": true, "t": "I don't have a soft side."}, {"a": "P", "r": true, "t": "I love a good fight."}, {"a": "I", "r": true, "t": "I postpone decisions."}, {"a": "O", "r": false, "t": "I see that rules are observed."}, {"a": "E", "r": false, "t": "I have a lot of fun."}, {"a": "A", "r": false, "t": "I am the first to act."}, {"a": "N", "r": true, "t": "I learn things slowly."}, {"a": "Q", "r": true, "t": "I seldom daydream."}, {"a": "V", "r": false, "t": "I can be stirred up easily."}, {"a": "W", "r": false, "t": "I am afraid of many things."}, {"a": "C", "r": false, "t": "I like to do things for others."}, {"a": "P", "r": true, "t": "I am out for my own personal gain."}, {"a": "I", "r": true, "t": "I am easily distracted."}, {"a": "O", "r": false, "t": "I want every detail taken care of."}, {"a": "E", "r": false, "t": "I laugh a lot."}, {"a": "A", "r": true, "t": "I do not have an assertive personality."}, {"a": "N", "r": false, "t": "I formulate ideas clearly."}, {"a": "Q", "r": true, "t": "I seldom notice the emotional aspects of paintings and pictures."}], "start": [{"id": "AG", "ask": "Your age band", "opts": [["a", "Under 30"], ["b", "30 to 44"], ["c", "45 to 59"], ["d", "60 or over"]]}, {"id": "SR", "ask": "Have you done personality tests, or spent much time thinking about what you're like?", "opts": [["a", "A lot"], ["b", "Some"], ["c", "Hardly at all"]]}], "ctx": [{"id": "X1", "ask": "When I disagree with someone close to me, I usually…", "opts": [["a", "say so straight away"], ["b", "wait for a good moment"], ["c", "drop hints"], ["d", "keep it to myself"]]}, {"id": "X2", "ask": "When I disagree with a boss, a teacher or someone in charge, I usually…", "opts": [["a", "say so straight away"], ["b", "wait for a good moment"], ["c", "drop hints"], ["d", "keep it to myself"]]}, {"id": "X3", "ask": "When someone I care about is upset, I usually…", "opts": [["a", "try to fix the problem"], ["b", "listen and stay with them"], ["c", "give them space"], ["d", "try to cheer them up"]]}, {"id": "X4", "ask": "When I am upset, I mostly want other people to…", "opts": [["a", "help me fix the problem"], ["b", "listen and stay with me"], ["c", "give me space"], ["d", "cheer me up"]]}, {"id": "X5", "ask": "After a long day with a lot of people, I most want…", "opts": [["a", "time alone"], ["b", "one or two close people"], ["c", "more company"], ["d", "it makes no difference"]]}, {"id": "X6", "ask": "On a free day with no plans, I usually…", "opts": [["a", "make a plan"], ["b", "see what comes"], ["c", "catch up on tasks"], ["d", "rest and do very little"]]}, {"id": "X7", "ask": "When someone praises me in front of others, I mostly feel…", "opts": [["a", "pleased"], ["b", "uncomfortable"], ["c", "both"], ["d", "nothing much"]]}, {"id": "X8", "ask": "After I make a mistake that other people noticed, I mostly…", "opts": [["a", "fix it and move on"], ["b", "keep thinking about it for a long time"], ["c", "explain why it happened"], ["d", "make a joke of it"]]}, {"id": "X9", "ask": "With a big decision, I usually…", "opts": [["a", "decide quickly and go"], ["b", "think for a long time, then decide"], ["c", "ask people I trust"], ["d", "put it off"]]}, {"id": "X10", "ask": "When someone asks for help and I am busy, I usually…", "opts": [["a", "help anyway"], ["b", "say not now"], ["c", "help, but feel annoyed"], ["d", "it depends who is asking"]]}], "end": [{"id": "EZ", "ask": "How were these questions to answer?", "opts": [["a", "Easy"], ["b", "Mostly easy"], ["c", "Some were hard"], ["d", "Hard"]]}]};
const DEBUG = /*DEBUG*/null;
const LAB = ["No", "Mostly no", "In between", "Mostly yes", "Yes"];
const KEY = "short-questions-2", PAGES = 13;
let st = { who: null, a: {}, b: Array(100).fill(0), page: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.b && s.b.length === 100) st = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function single(q) {
  const c = el("div", "q"); c.appendChild(el("p", "ask", q.ask));
  for (const [k, text] of q.opts) { const b = el("button", "opt" + (st.a[q.id] === k ? " sel" : ""), text);
    b.onclick = () => { if (st.a[q.id] === k) delete st.a[q.id]; else st.a[q.id] = k; update(); }; c.appendChild(b); }
  return c;
}
function scaleCard(i) {
  const c = el("div", "q"); c.appendChild(el("p", "ask", D.items[i].t));
  const row = el("div", "scale");
  LAB.forEach((lab, k) => { const b = el("button", "s" + (st.b[i] === k + 1 ? " sel" : ""), lab);
    b.onclick = () => { st.b[i] = (st.b[i] === k + 1) ? 0 : k + 1; update(); }; row.appendChild(b); });
  c.appendChild(row); return c;
}
function code() {
  const parts = ["OS2", "R=" + (st.who || "?")];
  for (const q of D.start) parts.push(q.id + "=" + (st.a[q.id] || "?"));
  parts.push("B=" + st.b.join(""));
  for (const q of D.ctx.concat(D.end)) parts.push(q.id + "=" + (st.a[q.id] || "?"));
  return parts.join(" ");
}
function nav(kids, nextLabel) {
  const n = el("div", "nav");
  if (st.page > 0) { const b = el("button", "btn", "Back"); b.onclick = () => { st.page--; update(true); }; n.appendChild(b); }
  const x = el("button", "btn primary", nextLabel || "Next"); x.onclick = () => { st.page++; update(true); }; n.appendChild(x);
  kids.push(n);
}
function update(scroll) {
  save();
  const app = document.getElementById("app"), kids = [], p = st.page;
  const top = el("div", "top"); top.appendChild(el("span", null, p === 0 ? "Start" : p < PAGES ? "Page " + p + " of " + (PAGES - 1) : "Finished")); top.appendChild(el("span", null, "Nothing is sent from this page.")); kids.push(top);
  if (p === 0) {
    kids.push(el("h2", null, "A short set of questions about you"));
    const ul = el("ul", "plain");
    ["It takes about 10 minutes. The statements are short. Answer how you generally are, not how you would like to be.",
     "There are no right or wrong answers. Go with your first sense of each one. You can leave any statement blank.",
     "Your answers become a code of letters and numbers with no name in it. An AI research assistant reads the code and writes a short description for you to react to.",
     "You can stop at any time."].forEach(t => ul.appendChild(el("li", null, t)));
    kids.push(ul);
    const w = el("div", "q"); w.appendChild(el("p", "ask", "Which reader are you?"));
    for (const k of ["1", "2", "3"]) { const b = el("button", "opt" + (st.who === k ? " sel" : ""), "Reader " + k); b.onclick = () => { st.who = k; update(); }; w.appendChild(b); }
    kids.push(w);
    for (const q of D.start) kids.push(single(q));
    nav(kids, "Begin");
  } else if (p <= 10) {
    kids.push(el("p", "intro", "How well does each statement describe you?"));
    for (let i = (p - 1) * 10; i < p * 10; i++) kids.push(scaleCard(i));
    nav(kids);
  } else if (p === 11) {
    kids.push(el("h2", null, "Everyday situations")); kids.push(el("p", "intro", "Pick the one that is most usual for you."));
    for (const q of D.ctx) kids.push(single(q));
    nav(kids);
  } else if (p === 12) {
    kids.push(el("h2", null, "Last one"));
    for (const q of D.end) kids.push(single(q));
    nav(kids, "Finish");
  } else {
    kids.push(el("h2", null, "Done. Thank you."));
    const blank = st.b.filter(x => !x).length;
    if (blank) kids.push(el("div", "warn", blank + " statement" + (blank > 1 ? "s were" : " was") + " left blank. That is fine. You can also go back."));
    kids.push(el("p", "intro", "Copy this code and send it back to the person who gave you this link."));
    const ta = el("textarea"); ta.readOnly = true; ta.value = code(); ta.onfocus = () => ta.select(); kids.push(ta);
    const n = el("div", "nav");
    const back = el("button", "btn", "Back"); back.onclick = () => { st.page = 12; update(true); }; n.appendChild(back);
    const cp = el("button", "btn primary", "Copy code");
    cp.onclick = async () => { let ok = false; try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { try { ta.focus(); ta.select(); ok = document.execCommand("copy"); } catch (e2) {} }
      cp.textContent = ok ? "Copied" : "Select the text above and copy it"; };
    n.appendChild(cp); kids.push(n);
    const again = el("button", "btn", "Clear everything and start for the next person"); again.style.width = "100%"; let armed = false;
    again.onclick = () => { if (!armed) { armed = true; again.textContent = "Tap again to clear these answers (copy the code first)"; return; }
      st = { who: null, a: {}, b: Array(100).fill(0), page: 0 }; update(true); };
    kids.push(again);
  }
  app.replaceChildren(...kids);
  if (scroll) { try { window.scrollTo(0, 0); app.scrollIntoView(); } catch (e) {} }
}
if (DEBUG) { if (DEBUG.fill) { st.who = "1"; st.b = st.b.map((_, i) => (i * 7) % 5 + 1); for (const q of D.start.concat(D.ctx, D.end)) st.a[q.id] = q.opts[1][0]; } st.page = DEBUG.page; }
update();
</script>
